# Virtual workspace member (D033): declares dependencies only; the package
# itself resolves from the repository root and is never built or installed.
[project]
name = "semanticseams-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # the read-only core: ModelGraph, model_hash and the errors (D034)
    "semanticseams",
    "rdflib>=7.0",
    "pyshacl>=0.30",
    "SpiffWorkflow>=3.0",
    "lxml>=5.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    # backs request.form() in generated routes
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    # serves seams_runtime.host
    "uvicorn[standard]>=0.30",
]

[tool.uv]
package = false

[tool.uv.sources]
semanticseams = { workspace = true }
