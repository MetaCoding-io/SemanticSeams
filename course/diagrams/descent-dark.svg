<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="descent-dark-title descent-dark-desc" id="descent-dark-root">
        <title id="descent-dark-title">The descent: one graph, four notations</title>
        <desc id="descent-dark-desc">An architecture diagram of the expense app's canonical descent: a C4 container presents an IFML page whose submit event triggers a BPMN process, which is decided by a DMN table and writes a SHACL shape that has a statechart lifecycle, every arrow a seam predicate.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap');
      #descent-dark-root { --color-paper: #121a20; --color-ink: #e8ece9; --color-muted: #a3b0b8; --color-accent: #e8865c;
            --font-sans: 'IBM Plex Sans', system-ui, sans-serif; --font-mono: 'IBM Plex Mono', ui-monospace, monospace; }
      #descent-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #descent-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#descent-dark-root .diagram-container { overflow-x: visible; }
}</style>
