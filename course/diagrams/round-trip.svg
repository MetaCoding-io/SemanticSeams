        <title id="round-trip-title">Getting an edit back into the model</title>
        <desc id="round-trip-desc">A diagram of the generation pipeline from model to output with its trace sidecar and lock, and the write-back path that turns an edited output line into a one-triple patch applied through the write path.</desc>
