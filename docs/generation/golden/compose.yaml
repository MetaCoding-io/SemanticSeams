# Generated by the seams compose generator from the chat-app model. Do not edit.  # [fixed]
# model-hash: sha256:<model-hash>  # [fixed]
services:  # [fixed]
  chat_ui:  # [graph: :chat_system arch:contains :chat_ui]
    image: ghcr.io/example/chat-ui:latest  # [graph: :chat_ui deploy:artifact deploy:Artifact deploy:reference deploy:version]
    ports:  # [graph: :chat_ui deploy:port deploy:Port deploy:publishedPort]
      - "8080:8000"  # [graph: :chat_ui deploy:port deploy:publishedPort deploy:containerPort]
    depends_on:  # [graph: :chat_ui deploy:dependsOn]
      - chat_api  # [graph: :chat_ui deploy:dependsOn :chat_api]
    deploy:  # [graph: :chat_ui seam:deployedTo]
      placement:  # [graph: :chat_ui seam:deployedTo]
        constraints:  # [graph: :chat_ui seam:deployedTo]
          - node.labels.seams.node == web01  # [graph: :chat_ui seam:deployedTo :web01 rdfs:label]
  chat_api:  # [graph: :chat_system arch:contains :chat_api]
    image: ghcr.io/example/chat-api:0.3.1  # [graph: :chat_api deploy:artifact deploy:Artifact deploy:reference deploy:version]
    deploy:  # [graph: :chat_api deploy:replicas deploy:placement]
      replicas: 3  # [graph: :chat_api deploy:replicas]
      placement:  # [graph: :chat_api deploy:placement seam:deployedTo]
        constraints:  # [graph: :chat_api seam:deployedTo]
          - node.labels.seams.node == app01  # [graph: :chat_api seam:deployedTo :app01 rdfs:label]
    depends_on:  # [graph: :chat_api deploy:dependsOn]
      - message_db  # [graph: :chat_api deploy:dependsOn :message_db]
    expose:  # [graph: :chat_api deploy:port deploy:Port]
      - "8000"  # [graph: :chat_api deploy:port deploy:containerPort]
    environment:  # [graph: :chat_api deploy:configuration deploy:Configuration]
      SEAMS_MODEL: /model/chat-app.trig  # [fixed]
      SEAMS_MODEL_HASH: "sha256:<model-hash>"  # [fixed]
      DB_URL_FILE: /run/secrets/db_url  # [graph: deploy:binding deploy:key <https://secrets.example.org/chat/prod/db-url>]
      LLM_API_KEY_FILE: /run/secrets/llm_api_key  # [graph: deploy:binding deploy:key <https://secrets.example.org/chat/prod/llm-key>]
      LLM_GATEWAY_URL: http://llm_gateway:8000  # [graph: deploy:binding deploy:key deploy:serviceOf :llm_gateway deploy:containerPort]
    secrets:  # [graph: :chat_api deploy:configuration deploy:binding deploy:secretRef]
      - db_url  # [graph: deploy:key deploy:secretRef <https://secrets.example.org/chat/prod/db-url>]
      - llm_api_key  # [graph: deploy:key deploy:secretRef <https://secrets.example.org/chat/prod/llm-key>]
    volumes:  # [graph: :chat_api seam:executes :send_message_process]
      - ./examples/chat-app/chat-app.trig:/model/chat-app.trig:ro  # [fixed]
      - ./examples/chat-app/chat_process.bpmn:/model/chat_process.bpmn:ro  # [graph: :chat_bpmn seam:renderPayload]
      - ./examples/chat-app/routing.dmn:/model/routing.dmn:ro  # [graph: :routing_dmn seam:renderPayload]
  llm_gateway:  # [graph: :chat_system arch:contains :llm_gateway]
    image: ghcr.io/example/llm-gateway:latest  # [graph: :llm_gateway deploy:artifact deploy:Artifact deploy:reference deploy:version]
    expose:  # [graph: :llm_gateway deploy:port deploy:Port]
      - "8000"  # [graph: :llm_gateway deploy:port deploy:containerPort]
    environment:  # [graph: :llm_gateway deploy:configuration deploy:Configuration]
      UPSTREAM_BASE_URL: https://api.openai.com/v1  # [graph: deploy:binding deploy:key deploy:value]
    deploy:  # [graph: :llm_gateway seam:deployedTo]
      placement:  # [graph: :llm_gateway seam:deployedTo]
        constraints:  # [graph: :llm_gateway seam:deployedTo]
          - node.labels.seams.node == app01  # [graph: :llm_gateway seam:deployedTo :app01 rdfs:label]
  message_db:  # [graph: :chat_system arch:contains :message_db]
    image: postgres:16  # [graph: :message_db deploy:artifact deploy:Artifact deploy:reference deploy:version]
    environment:  # [graph: :message_db deploy:configuration deploy:Configuration]
      POSTGRES_DB: chat  # [graph: deploy:binding deploy:key deploy:value]
    volumes:  # [graph: :message_db deploy:volume deploy:Volume]
      - message_db_data:/var/lib/postgresql/data  # [graph: :message_db deploy:volume deploy:volumeName deploy:mountPath]
    healthcheck:  # [graph: :message_db deploy:healthcheck deploy:Healthcheck]
      test: ["CMD-SHELL", "pg_isready -U postgres"]  # [graph: :message_db deploy:healthcheck deploy:probe]
      interval: 5s  # [graph: :message_db deploy:healthcheck deploy:interval]
    deploy:  # [graph: :message_db seam:deployedTo]
      placement:  # [graph: :message_db seam:deployedTo]
        constraints:  # [graph: :message_db seam:deployedTo]
          - node.labels.seams.node == db01  # [graph: :message_db seam:deployedTo :db01 rdfs:label]
secrets:  # [fixed]
  db_url:  # [graph: deploy:key <https://secrets.example.org/chat/prod/db-url>]
    name: chat-prod-db-url  # [graph: deploy:binding deploy:secretName]
    external: true  # [graph: deploy:secretName]
  llm_api_key:  # [graph: deploy:key <https://secrets.example.org/chat/prod/llm-key>]
    name: chat-prod-llm-key  # [graph: deploy:binding deploy:secretName]
    external: true  # [graph: deploy:secretName]
volumes:  # [graph: deploy:volume deploy:Volume]
  message_db_data: {}  # [graph: :message_db deploy:volume deploy:Volume deploy:volumeName]
