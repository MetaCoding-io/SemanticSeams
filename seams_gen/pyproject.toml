# Virtual workspace member (D033): declares dependencies only; the package
# itself resolves from the repository root and is never built or installed.
[project]
name = "semanticseams-gen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # the model is read only through the seams library (D034)
    "semanticseams",
    "rdflib>=7.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.uv.sources]
semanticseams = { workspace = true }
