<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="notations-timeline-dark-title notations-timeline-dark-desc" id="notations-timeline-dark-root">
        <title id="notations-timeline-dark-title">Seventy years of drawing software</title>
        <desc id="notations-timeline-dark-desc">A timeline from 1947 to 2025 of the notations for drawing software, with the ones a machine executed filled in, the ones that stayed documentation hollow, and SysML v2's views-as-queries highlighted.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap');
      #notations-timeline-dark-root { --color-paper: #121a20; --color-ink: #e8ece9; --color-muted: #a3b0b8; --color-accent: #e8865c;
            --font-sans: 'IBM Plex Sans', system-ui, sans-serif; --font-mono: 'IBM Plex Mono', ui-monospace, monospace; }
      #notations-timeline-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #notations-timeline-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#notations-timeline-dark-root .diagram-container { overflow-x: visible; }
}</style>
