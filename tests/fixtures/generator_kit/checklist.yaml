model: "chat-app.trig"  # [fixed]
model_hash: "sha256:<model-hash>"  # [fixed]
processes:  # [fixed]
  - process: "Send Message Process"  # [graph: :send_message_process proc:Process rdfs:label]
    bpmn: "https://example.org/chat/chat_bpmn"  # [graph: :send_message_process seam:detailedBy :chat_bpmn]
    tasks:  # [graph: :chat_bpmn seam:renderPayload]
      - "ServiceTask: Persist User Message -> POST /conversations/{conversation}/messages"  # [graph: :chat_bpmn#persist_user_msg seam:invokes :send_message_op hydra:method comm:path]
      - "BusinessRuleTask: Route to Provider (decision: Route to Provider)"  # [graph: :chat_bpmn#route_to_provider seam:decidedBy :routing_decision rdfs:label]
      - "ServiceTask: Invoke LLM -> POST /v1/chat/completions"  # [graph: :chat_bpmn#invoke_llm seam:invokes :completion_op hydra:method comm:path]
      - "ServiceTask: Persist Assistant Response"  # [graph: :chat_bpmn#persist_response proc:ServiceTask]
