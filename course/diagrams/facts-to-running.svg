      <style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap');
      #facts-to-running-root { --color-paper: #f4f1ea; --color-ink: #1d2a35; --color-muted: #5b6b78; --color-accent: #a64a24;
            --font-sans: 'IBM Plex Sans', system-ui, sans-serif; --font-mono: 'IBM Plex Mono', ui-monospace, monospace; }
      #facts-to-running-root { font-family: var(--font-sans); color: var(--color-ink); }
      #facts-to-running-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#facts-to-running-root .diagram-container { overflow-x: visible; }
}</style>
