        <title id="shapes-five-ways-title">One shape, read five ways</title>
        <desc id="shapes-five-ways-desc">A data-flow diagram: the expense shape is read as the runtime's validation, the generated form, the operation contract, the JSON-LD context and the SemPKM package, with nothing restated; below, the shapes over the model itself drive the viewer's health badge, and a model that passes them must generate.</desc>
