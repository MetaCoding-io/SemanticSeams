<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="facts-to-running-title facts-to-running-desc" id="facts-to-running-root">
        <title id="facts-to-running-title">From facts to a running system</title>
        <desc id="facts-to-running-desc">An architecture diagram: the model's environment facts feed the compose generator, which writes one compose file per environment and records the lock; Docker brings the development file up; seams status compares each running container's model hash with the lock's history, and seams secrets checks that the keys production names exist without reading a value.</desc>
