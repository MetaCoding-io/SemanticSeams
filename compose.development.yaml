# Generated by the seams compose generator from the chat-app model. Do not edit.
# model-hash: sha256:11d35819c97e7e7599603d0e806ac6f4bdf0a195feb6c2256dbf037bcedc06bd
# environment: https://example.org/chat/development
name: chat_system
services:
  chat_api:
    image: seams/chat-api:local
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      args:
        SEAMS_APP_DIR: examples/chat-app
        SEAMS_ROUTES_FILE: chat_api.py
    pull_policy: build
    expose:
      - "8000"
    depends_on:
      llm_gateway:
        condition: service_healthy
      message_db:
        condition: service_healthy
    environment:
      SEAMS_MODEL: /model/chat-app.trig
      SEAMS_MODEL_HASH: "sha256:11d35819c97e7e7599603d0e806ac6f4bdf0a195feb6c2256dbf037bcedc06bd"
      DB_URL_FILE: /run/secrets/db_url
      LLM_GATEWAY_URL: http://llm_gateway:8000
      SEAMS_DEV_USER: ${SEAMS_DEV_USER:-builder}
      SEAMS_SEED: ${SEAMS_SEED:-/app/seed.json}
    secrets:
      - db_url
    volumes:
      - ./examples/chat-app/chat-app.trig:/model/chat-app.trig:ro
      - ./examples/chat-app/chat_process.bpmn:/model/chat_process.bpmn:ro
      - ./examples/chat-app/routing.dmn:/model/routing.dmn:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    deploy:
      # The model declares 3 replicas; one until backlog A10 moves process state out of the process.
      replicas: 1
  chat_ui:
    image: caddy:2-alpine
    command: caddy reverse-proxy --from :8000 --to chat_api:8000
    ports:
      - "8080:8000"
    depends_on:
      chat_api:
        condition: service_healthy
  llm_gateway:
    image: seams/llm-gateway:local
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    pull_policy: build
    expose:
      - "8000"
    environment:
      LLM_API_KEY_FILE: /run/secrets/llm_api_key
      LLM_GATEWAY_STUB: ${LLM_GATEWAY_STUB:-}
      LLM_MODEL_OVERRIDE: ${LLM_MODEL_OVERRIDE:-}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-https://api.openai.com/v1}
    secrets:
      - llm_api_key
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
  message_db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seams-dev}
    volumes:
      - message_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
secrets:
  db_url:
    file: ${DB_URL_FILE:-./docker/local-secrets/db_url}
  llm_api_key:
    file: ${LLM_API_KEY_FILE:-./.secrets/llm_api_key}
volumes:
  message_db_data: {}
