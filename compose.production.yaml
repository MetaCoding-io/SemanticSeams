# Generated by the seams compose generator from the chat-app model. Do not edit.
# model-hash: sha256:1f6f9f8093b86813dd4f2e81201925b58e796874253930c6aec5a9a6827fe1ac
# environment: https://example.org/chat/production
name: chat_system
services:
  chat_api:
    image: ghcr.io/example/chat-api:0.3.1
    expose:
      - "8000"
    depends_on:
      llm_gateway:
        condition: service_healthy
      message_db:
        condition: service_healthy
    environment:
      SEAMS_MODEL: /model/chat-app.trig
      SEAMS_MODEL_HASH: "sha256:1f6f9f8093b86813dd4f2e81201925b58e796874253930c6aec5a9a6827fe1ac"
      DB_URL_FILE: /run/secrets/db_url
      LLM_GATEWAY_URL: http://llm_gateway:8000
    secrets:
      - db_url
    volumes:
      - ./examples/chat-app/chat-app.trig:/model/chat-app.trig:ro
      - ./examples/chat-app/chat_process.bpmn:/model/chat_process.bpmn:ro
      - ./examples/chat-app/routing.dmn:/model/routing.dmn:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    deploy:
      # The model declares 3 replicas; one until backlog A10 moves process state out of the process.
      replicas: 1
      placement:
        constraints:
          - node.labels.seams.node == app01
  chat_ui:
    image: caddy:2-alpine
    command: caddy reverse-proxy --from :8000 --to chat_api:8000
    ports:
      - "8080:8000"
    depends_on:
      chat_api:
        condition: service_healthy
    deploy:
      placement:
        constraints:
          - node.labels.seams.node == web01
  llm_gateway:
    image: ghcr.io/example/llm-gateway:latest
    expose:
      - "8000"
    environment:
      LLM_API_KEY_FILE: /run/secrets/llm_api_key
      UPSTREAM_BASE_URL: https://api.openai.com/v1
    secrets:
      - llm_api_key
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    deploy:
      placement:
        constraints:
          - node.labels.seams.node == app01
  message_db:
    image: postgres:16
    environment:
      POSTGRES_DB: chat
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - message_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    deploy:
      placement:
        constraints:
          - node.labels.seams.node == db01
secrets:
  db_url:
    name: chat-prod-db-url
    external: true
  llm_api_key:
    name: chat-prod-llm-key
    external: true
  postgres_password:
    name: chat-prod-postgres-password
    external: true
volumes:
  message_db_data: {}
