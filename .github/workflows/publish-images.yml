name: Publish images

# Builds the runtime image of each project's serving container from its generated
# Dockerfile (seams_gen dockerfile, M016/S03) and tags it with the production
# deploy:artifact's reference and version, plus sha-<model hash>, so the production
# compose file names an image this workflow produces. Gated (ADR-0015, backlog A5):
# it runs only by hand or on a v* tag, never on a push to main or a pull request,
# and pushes only on the tag or when the manual run sets `push`.
on:
  workflow_dispatch:
    inputs:
      push:
        description: Push the images to their registries (otherwise build only)
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  # The projects whose images are published; tests/test_publish_workflow.py reads it.
  SEAMS_IMAGE_PROJECTS: examples/chat-app examples/expenses/chapter-09

jobs:
  # python -m seams_gen.images lists, per generated Dockerfile, its build context, the
  # production reference and version and the model hash, as JSON for the matrix below.
  images:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - id: list
        run: |
          images=$(uv run python -m seams_gen.images $SEAMS_IMAGE_PROJECTS | jq -c .)
          echo "images=$images" >> "$GITHUB_OUTPUT"

  publish:
    needs: images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.images.outputs.images) }}
    env:
      PUSH: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.push == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ matrix.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfile already labels io.semanticseams.model-hash and
      # io.semanticseams.container; the revision is the commit it was built from.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ join(matrix.tags, ',') }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            io.semanticseams.model-hash=${{ matrix.model_hash }}
