# The `seams` command line (D042). uv installs no console scripts for virtual
# members (D033), so the CLI is a packaged member of its own.
[project]
name = "semanticseams-cli"
version = "0.1.0"
description = "The seams command: generate an app's outputs from its seams.toml project file."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "semanticseams",
    # the third-party dependencies of seams_gen, which the CLI imports
    "rdflib>=7.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
seams = "seams_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seams_cli"]

[tool.hatch.build]
# The editable install puts src and the repository root on sys.path, so the
# virtual members seams_gen and seams_runtime import from any working directory.
# Setting dev-mode-dirs replaces the default, hence "src" is listed too.
dev-mode-dirs = ["src", "../.."]

[tool.uv.sources]
semanticseams = { workspace = true }
