name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            viewer/requirements.txt
      # The viewer tests import the FastAPI app, so the viewer's dependencies are needed too.
      - run: pip install -r requirements-dev.txt -r viewer/requirements.txt
      - run: pytest -q
