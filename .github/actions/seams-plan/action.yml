# Runs `seams plan BASE:PROJECT PROJECT` for each listed project whose files differ
# from the base ref, and appends each change plan to the job summary
# (docs/reference/seams-cli.md, D053). A breaking change does not fail the step; a
# plan that cannot be made does. The checkout needs the base ref's history
# (fetch-depth: 0) and `seams` on PATH. This repository's change-plan job does:
#
#   - uses: actions/checkout@v4
#     with:
#       fetch-depth: 0
#   - run: uv sync --locked --all-packages
#   - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
#   - uses: ./.github/actions/seams-plan
#     with:
#       base: origin/${{ github.base_ref }}
#       projects: |
#         examples/chat-app
#         examples/expenses/chapter-01
name: seams plan
description: Write a Markdown change plan to the job summary for each project whose model changed against a base git ref.
inputs:
  projects:
    description: Newline-separated project paths relative to the repository root, each a directory or the seams.toml file in one. Blank lines are ignored.
    required: false
    default: "."
  base:
    description: The git ref to compare against, such as origin/main.
    required: true
runs:
  using: composite
  steps:
    - name: seams plan
      shell: bash
      # The inputs arrive through the environment, never interpolated into the
      # script, so a project path or ref cannot inject shell.
      env:
        INPUT_PROJECTS: ${{ inputs.projects }}
        INPUT_BASE: ${{ inputs.base }}
      run: |
        summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
        out="$(mktemp)"
        trap 'rm -f "$out"' EXIT
        failed=0
        changed=0
        while IFS= read -r p || [ -n "$p" ]; do
          p="${p#"${p%%[![:space:]]*}"}"
          p="${p%"${p##*[![:space:]]}"}"
          [ -z "$p" ] && continue
          case "$p" in
            seams.toml) p="." ;;
            */seams.toml) p="${p%/seams.toml}" ;;
          esac
          echo "::group::seams plan $INPUT_BASE:$p $p"
          if ! git rev-parse --verify --quiet "$INPUT_BASE^{commit}" > /dev/null; then
            echo "::error::seams plan: unknown base ref $INPUT_BASE"
            failed=1
          elif ! git cat-file -e "$INPUT_BASE:$p" 2> /dev/null; then
            echo "$p is new: it does not exist at $INPUT_BASE."
            printf '# %s\n\nNew project: not present at `%s`.\n\n' "$p" "$INPUT_BASE" >> "$summary"
            changed=1
          else
            # The step runs under bash -e, so each status is caught with ||.
            status=0
            git diff --quiet "$INPUT_BASE" -- "$p" || status=$?
            if [ "$status" -eq 0 ]; then
              echo "$p is unchanged against $INPUT_BASE."
            elif [ "$status" -ne 1 ]; then
              echo "::error::git diff failed for $p against $INPUT_BASE"
              failed=1
            else
              changed=1
              status=0
              seams plan "$INPUT_BASE:$p" "$p" > "$out" || status=$?
              cat "$out"
              if [ "$status" -le 1 ]; then
                if [ "$status" -eq 1 ]; then
                  echo "::warning::seams plan: $p has breaking changes against $INPUT_BASE"
                fi
                { printf '# %s\n\n' "$p"; sed 's/^#/##/' "$out"; echo; } >> "$summary"
              else
                echo "::error::seams plan failed for $p"
                failed=1
              fi
            fi
          fi
          echo "::endgroup::"
        done <<< "$INPUT_PROJECTS"
        if [ "$changed" -eq 0 ] && [ "$failed" -eq 0 ]; then
          printf '# Change plan\n\nNo model changed against `%s`.\n' "$INPUT_BASE" >> "$summary"
        fi
        exit "$failed"
