<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="interpret-generate-title interpret-generate-desc" id="interpret-generate-root">
        <title id="interpret-generate-title">Interpret behaviour, generate structure</title>
        <desc id="interpret-generate-desc">A layer stack of the generated application's five layers, each marked interpreted by an existing engine or generated as logic-free structure, with one graph-literate worker spanning the interpreted layers.</desc>
