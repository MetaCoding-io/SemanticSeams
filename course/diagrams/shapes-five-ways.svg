      #shapes-five-ways-root { --color-paper: #f4f1ea; --color-ink: #1d2a35; --color-muted: #5b6b78; --color-accent: #a64a24;
            --font-sans: 'IBM Plex Sans', system-ui, sans-serif; --font-mono: 'IBM Plex Mono', ui-monospace, monospace; }
      #shapes-five-ways-root { font-family: var(--font-sans); color: var(--color-ink); }
      #shapes-five-ways-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#shapes-five-ways-root .diagram-container { overflow-x: visible; }
}</style>
