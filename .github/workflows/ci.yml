name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    # The runtime store contract tests run against both backends: SQLite in a temp
    # file, PostgreSQL in this service. SEAMS_REQUIRE_POSTGRES turns a missing or
    # unreachable server into a failure instead of a skip.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SEAMS_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SEAMS_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      # setup-uv reads .python-version; the sync installs every member from uv.lock and
      # fails fast if the lock is out of date with the pyproject files.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run pytest -q
      # The generated chat-app code and compose.yaml are committed; regenerating must change nothing.
      - name: Generated outputs are current
        run: |
          # Activated so the commands below stay literal: tests/test_tutorial_doc.py
          # checks docs/tutorial.md against them. Each seams.toml names its
          # generators and outputs (docs/reference/seams-cli.md).
          source .venv/bin/activate
          seams generate --project examples/chat-app
          seams generate --project examples/expenses/chapter-01
          seams generate --project examples/expenses/chapter-02
          seams generate --project examples/expenses/chapter-03
          seams generate --project examples/expenses/chapter-04
          seams generate --project examples/expenses/chapter-05
          seams generate --project examples/expenses/chapter-06
          seams generate --project examples/expenses/chapter-07
          seams generate --project examples/expenses/chapter-08
          git diff --exit-code -- examples compose.yaml
          untracked=$(git status --porcelain --untracked-files=all -- examples compose.yaml)
          if [ -n "$untracked" ]; then
            echo "Regeneration left untracked or modified files; commit or delete them:"
            echo "$untracked"
            exit 1
          fi

  # docs/tutorial.md end to end: build and start the compose stack (gateway in
  # stub mode), chat through the generated page and routes, then tear it down.
  tutorial-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      # Puts the synced venv first on PATH, so the test steps below run its pytest.
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: SEAMS_E2E=1 pytest -q tests/test_tutorial_e2e.py
      - run: SEAMS_E2E=1 pytest -q tests/test_expense_e2e.py

  # Builds the docs site the way the Pages deploy does. Fails on a dead internal link,
  # or if a change to ontology/ or docs/queries/ breaks the reference-page generator.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      # uv run puts the venv's absolute bin on PATH, so scripts/generate.py finds rdflib.
      - run: uv run npm run build
        working-directory: docs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run ruff check
      - run: uv run ruff format --check

  # Strict pyright over packages/seams (configured in the root pyproject.toml).
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run pyright
