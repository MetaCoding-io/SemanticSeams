      #round-trip-root { --color-paper: #f4f1ea; --color-ink: #1d2a35; --color-muted: #5b6b78; --color-accent: #a64a24;
            --font-sans: 'IBM Plex Sans', system-ui, sans-serif; --font-mono: 'IBM Plex Mono', ui-monospace, monospace; }
      #round-trip-root { font-family: var(--font-sans); color: var(--color-ink); }
      #round-trip-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#round-trip-root .diagram-container { overflow-x: visible; }
}</style>
