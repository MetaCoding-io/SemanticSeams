name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The suite in four pytest-split groups, each run in parallel with pytest-xdist.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    # The runtime store contract tests run against both backends: SQLite in a temp
    # file, PostgreSQL in this service. SEAMS_REQUIRE_POSTGRES turns a missing or
    # unreachable server into a failure instead of a skip.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SEAMS_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SEAMS_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      # setup-uv reads .python-version; the sync installs every member from uv.lock and
      # fails fast if the lock is out of date with the pyproject files.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run pytest -q -n auto --splits 4 --group ${{ matrix.group }}

  seams-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      # The generated code, the compose.<environment>.yaml files and each seams.lock are
      # committed (ADR-0015: no hand-written compose override remains); seams check
      # fails on a stale, missing, hand-edited or orphaned output, a SHACL violation or a
      # gate returning rows. tests/test_tutorial_doc.py reads the projects list below.
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Generated outputs are current
        uses: ./.github/actions/seams-check
        with:
          projects: |
            examples/chat-app
            examples/expenses/chapter-01
            examples/expenses/chapter-02
            examples/expenses/chapter-03
            examples/expenses/chapter-04
            examples/expenses/chapter-05
            examples/expenses/chapter-06
            examples/expenses/chapter-07
            examples/expenses/chapter-08
            examples/expenses/chapter-09
            examples/expenses/chapter-10
            examples/expenses/chapter-11

  # On a pull request, writes a seams plan change plan to the job summary for each
  # project whose model changed against the base branch. A breaking change is
  # reported, not failed; seams check in the seams-check job is the gate.
  # tests/test_ci_change_plan.py checks the projects list matches the seams-check job's.
  change-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The base branch's history, so git can diff and archive origin/<base>.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Change plan
        uses: ./.github/actions/seams-plan
        with:
          base: origin/${{ github.base_ref }}
          projects: |
            examples/chat-app
            examples/expenses/chapter-01
            examples/expenses/chapter-02
            examples/expenses/chapter-03
            examples/expenses/chapter-04
            examples/expenses/chapter-05
            examples/expenses/chapter-06
            examples/expenses/chapter-07
            examples/expenses/chapter-08
            examples/expenses/chapter-09
            examples/expenses/chapter-10
            examples/expenses/chapter-11

  # docs/tutorial.md end to end: build and start the stack from the generated
  # compose.development.yaml (gateway in stub mode), chat through the generated page and routes, then tear it down.
  # e2e-expense: test_expense_e2e.py does the same for the expense app (chapter 9) and also runs
  # its generated smoke tests (generated/smoke) against the live stack.
  e2e-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      # Puts the synced venv first on PATH, so the test step below runs its pytest.
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: SEAMS_E2E=1 pytest -q tests/test_tutorial_e2e.py

  e2e-expense:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: SEAMS_E2E=1 pytest -q tests/test_expense_e2e.py

  # Builds the docs site and the course site the way the Pages deploy does. Fails on a
  # dead internal link, on a course link to a repository file that does not exist, or if
  # a change to ontology/ or docs/queries/ breaks the reference-page generator.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      # uv run puts the venv's absolute bin on PATH, so scripts/generate.py finds rdflib.
      - run: uv run npm run build
        working-directory: docs
      - run: npm ci
        working-directory: course
      - run: npm run build
        working-directory: course

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      # Fails in seconds, before the long jobs fail on its downstream effects (f925033).
      - run: .githooks/check-conflict-markers
      - run: uv run ruff check
      - run: uv run ruff format --check

  # Strict pyright over packages/seams (configured in the root pyproject.toml).
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run pyright

  # The one required check: fails if any job failed, was cancelled, or (except
  # change-plan, which only runs on pull requests) did not succeed.
  ci-ok:
    if: always()
    needs: [test, seams-check, change-plan, e2e-chat, e2e-expense, docs, lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e '
            to_entries
            | all(.value.result as $r
                  | ($r != "failure" and $r != "cancelled")
                    and (.key == "change-plan" or $r == "success"))
          '
