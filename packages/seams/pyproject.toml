[project]
name = "semanticseams"
version = "0.1.0"
description = "Read and validate Semantic Seams models."
readme = "README.md"
requires-python = ">=3.12"
# rdflib and lxml are the only dependencies this library may ever take.
dependencies = ["rdflib>=7.0", "lxml>=5.0"]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "seams"
