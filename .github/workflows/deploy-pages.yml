name: Deploy Pages

# Publishes one GitHub Pages site on every push to main that touches it: the project
# page (site/) at the root, and the docs site (docs/, built with VitePress) under /docs/.
# The docs' reference pages are generated from ontology/ and docs/queries/ at build
# time, so a change there redeploys too, as does a change to the locked Python
# environment that runs the generator (pyproject.toml, uv.lock).
# One-time repository setting: Settings → Pages → Source → GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "ontology/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the docs' "last updated" dates come from git history
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      # uv run puts the venv's absolute bin on PATH, so scripts/generate.py finds rdflib.
      - run: uv run npm run build
        working-directory: docs
        env:
          DOCS_BASE: /SemanticSeams/docs/
      - name: Assemble the project page and the docs into one artifact
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r docs/.vitepress/dist _site/docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
