      - "8000"
    depends_on:
      expense_db:
        condition: service_healthy
    environment:
      SEAMS_MODEL: /model/expenses.trig
      SEAMS_MODEL_HASH: "sha256:985c22518fe98496d51b6d02f79a80bb743322d95d4ba893cf7e02602934e04a"
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    volumes:
      - ./expenses.trig:/model/expenses.trig:ro
      - ./approval.bpmn:/model/approval.bpmn:ro
      - ./approval.dmn:/model/approval.dmn:ro
      - ./payout.bpmn:/model/payout.bpmn:ro
      - ./payout.dmn:/model/payout.dmn:ro
