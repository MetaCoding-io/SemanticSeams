name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            viewer/requirements.txt
      # The viewer tests import the FastAPI app, so the viewer's dependencies are needed too.
      - run: pip install -r requirements-dev.txt -r viewer/requirements.txt
      - run: pytest -q
      # The generated chat-app code and compose.yaml are committed; regenerating must change nothing.
      - name: Generated outputs are current
        run: |
          trig=examples/chat-app/chat-app.trig
          python -m seams_gen fastapi "$trig" --out examples/chat-app/generated
          python -m seams_gen htmx "$trig" --out examples/chat-app/generated/templates
          python -m seams_gen compose "$trig" --out .
          git diff --exit-code -- examples/chat-app/generated compose.yaml
          untracked=$(git status --porcelain --untracked-files=all -- examples/chat-app/generated compose.yaml)
          if [ -n "$untracked" ]; then
            echo "Regeneration left untracked or modified files; commit or delete them:"
            echo "$untracked"
            exit 1
          fi

  # docs/tutorial.md end to end: build and start the compose stack (gateway in
  # stub mode), chat through the generated page and routes, then tear it down.
  tutorial-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: SEAMS_E2E=1 pytest -q tests/test_tutorial_e2e.py
      - run: SEAMS_E2E=1 pytest -q tests/test_expense_e2e.py

  # Builds the docs site the way the Pages deploy does. Fails on a dead internal link,
  # or if a change to ontology/ or docs/queries/ breaks the reference-page generator.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
