# Semantic Seams project file for the chat app.
# It names the model, the generators with their output directories, and
# the environments the model declares.
# `seams generate` (run here, or with --project) rewrites every output below.
# Paths are relative to this file. Reference: docs/reference/seams-cli.md.

model = "chat-app.trig"

# `seams check` fails if any UI event can write data with no policy governing it.
gates = ["../../docs/queries/gates/ungoverned-writes.rq"]

[[generators]]
name = "fastapi"
out = "generated"

[[generators]]
name = "htmx"
out = "generated/templates"

# The repository-root compose.yaml; its bind mounts are relative to the root.
[[generators]]
name = "compose"
out = "../.."

[environments.prod]
